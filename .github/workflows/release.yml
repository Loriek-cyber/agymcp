name: Build, Test & Auto-Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Livello di incremento versione (auto dal commit, oppure forza patch/minor/major)"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system Qt dependencies, RPM builder & Python build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 rpm
          python -m pip install --upgrade pip
          pip install PyQt6 build

      - name: Run unit & offscreen GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Calculate semantic version bump (3-tier commit tags)
        id: version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          BUMP_LEVEL: ${{ github.event.inputs.bump || 'auto' }}
        run: |
          NEW_VERSION="$(python scripts/bump_version.py --message "$COMMIT_MSG" --level "$BUMP_LEVEL")"
          echo "Detected version output: $NEW_VERSION"
          if [ "$NEW_VERSION" = "NO_BUMP" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Python wheel, sdist, Fedora RPM, Debian DEB & standalone updater bundle
        run: |
          python -m build
          chmod +x packaging/fedora/build_rpm.sh packaging/debian/build_deb.sh
          if [ "${{ steps.version.outputs.should_release }}" = "true" ]; then
            BUILD_VERSION="${{ steps.version.outputs.new_version }}"
            TAG="${{ steps.version.outputs.tag }}"
            STAGE_DIR="$(mktemp -d)"
            BUNDLE_DIR="${STAGE_DIR}/agymcp-${TAG}"
            mkdir -p "${BUNDLE_DIR}"
            cp -r agymcp assets install.sh pyproject.toml README.md "${BUNDLE_DIR}/"
            chmod +x "${BUNDLE_DIR}/install.sh"
            tar -czf "dist/agymcp-${TAG}.tar.gz" -C "${STAGE_DIR}" "agymcp-${TAG}"
            rm -rf "${STAGE_DIR}"
          else
            BUILD_VERSION="$(python -c "from agymcp import __version__; print(__version__)")"
          fi
          ./packaging/fedora/build_rpm.sh "${BUILD_VERSION}" dist
          ./packaging/debian/build_deb.sh "${BUILD_VERSION}" dist
          ls -lh dist/

      - name: Commit bumped version, tag & push
        if: steps.version.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agymcp/__init__.py pyproject.toml
          git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin main --follow-tags

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/* \
            --title "agymcp ${{ steps.version.outputs.tag }}" \
            --generate-notes
