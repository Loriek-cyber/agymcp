[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agymcp"
version = "0.2.0"
description = "Antigravity MCP Installer & Manager — installa e gestisci server MCP da link o CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.4"]

[project.scripts]
agymcp = "agymcp.cli:main"

[tool.setuptools.packages.find]
include = ["agymcp*"]
